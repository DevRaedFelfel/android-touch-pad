<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0b0d10">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Touchpad</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="status"><span id="dot"></span><span id="state">connecting…</span></div>
  <div id="pad"></div>

  <div id="bar">
    <button id="btn-left" class="mb" type="button">Left</button>
    <button id="btn-right" class="mb" type="button">Right</button>
    <button id="btn-kb" class="tool" type="button" aria-label="Keyboard">⌨</button>
    <button id="btn-fs" class="tool" type="button" aria-label="Fullscreen">⛶</button>
    <button id="btn-gear" class="tool" type="button" aria-label="Settings">⚙</button>
  </div>

  <div id="keys" hidden>
    <div class="row">
      <button data-vk="27" type="button">Esc</button>
      <button data-vk="9" type="button">Tab</button>
      <button data-mod="17" type="button">Ctrl</button>
      <button data-mod="18" type="button">Alt</button>
      <button data-mod="91" type="button">Win</button>
      <button data-mod="16" type="button">Shift</button>
    </div>
    <div class="row">
      <button data-vk="37" data-repeat type="button">←</button>
      <button data-vk="38" data-repeat type="button">↑</button>
      <button data-vk="40" data-repeat type="button">↓</button>
      <button data-vk="39" data-repeat type="button">→</button>
      <button data-vk="8" data-repeat type="button">⌫</button>
      <button data-vk="13" type="button">Enter</button>
    </div>
    <div class="row">
      <button data-vk="46" data-repeat type="button">Del</button>
      <button data-vk="36" type="button">Home</button>
      <button data-vk="35" type="button">End</button>
      <button data-vk="33" data-repeat type="button">PgUp</button>
      <button data-vk="34" data-repeat type="button">PgDn</button>
      <button id="btn-fkeys" type="button">F1–F12</button>
    </div>
    <div class="row" id="fkeys" hidden></div>
  </div>

  <input id="kbin" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Keyboard input">

  <div id="settings" hidden>
    <label>Pointer speed <input id="set-sensitivity" type="range" min="0.5" max="4" step="0.1"></label>
    <label>Scroll speed <input id="set-scrollSpeed" type="range" min="0.5" max="3" step="0.1"></label>
    <label><input id="set-natural" type="checkbox"> Natural scrolling</label>
    <label><input id="set-tapToClick" type="checkbox"> Tap to click</label>
    <label><input id="set-haptics" type="checkbox"> Haptic tick on click</label>
    <label><input id="set-leftHanded" type="checkbox"> Left-handed buttons</label>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
